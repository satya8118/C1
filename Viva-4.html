:root{

body{

.wrap{max-width:820px; margin:0 auto; padding:0 20px;}

header.top{padding:40px 0 22px; text-align:center;}
.eyebrow{
  font-family:'IBM Plex Mono', monospace; font-size:12.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--amber); font-weight:600; margin-bottom:10px;
}
h1{

  margin:0 0 10px; color:var(--indigo-deep); letter-spacing:-0.01em;
}
.sub{color:var(--ink-soft); font-size:15px; max-width:540px; margin:0 auto;}

/* ---------- Toolbar ---------- */
#toolbar{
  position:sticky; top:0; z-index:50;
  background:rgba(247,246,251,0.94);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);

}
.toolbar-inner{max-width:820px; margin:0 auto;}
#search{

}

.chip-row{display:flex; flex-wrap:wrap; gap:7px; align-items:center;}
.chip{
  font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600;
  padding:6px 12px; border-radius:99px; border:1.5px solid var(--line);
  background:#0d0c11; color:var(--ink-soft); cursor:pointer; user-select:none;
  transition:all .12s ease; white-space:nowrap;
}
.chip:hover{border-color:var(--indigo-soft);}
.chip.active{background:var(--indigo); color:#fff; border-color:var(--indigo);}
.toolbar-bottom{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-top:12px; flex-wrap:wrap;
}
#count-label{font-size:13px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
.actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.btn{
  appearance:none; border:none; cursor:pointer;
  font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:13.5px;
  padding:8px 14px; border-radius:9px;
  transition:transform .12s ease, background .12s ease;
}
.btn:hover{transform:translateY(-1px);}
.btn-primary{background:var(--indigo); color:#fff;}
.btn-primary:hover{background:var(--indigo-deep);}
.btn-ghost{background:transparent; color:var(--indigo); border:1.5px solid var(--indigo-soft);}
.btn-ghost:hover{background:#1c1a28;}
.btn-sm{font-size:12.5px; padding:6px 11px;}
#copy-feedback{font-size:12.5px; color:var(--sage); font-family:'IBM Plex Mono',monospace; min-height:16px;}

/* ---------- Question list ---------- */
#list{margin-top:4px;}
.qcard{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px 20px; margin-bottom:12px;
  display:flex; gap:14px; align-items:flex-start;
  transition:border-color .12s ease;
  cursor:pointer;
}
.qcard.selected{border-color:var(--sage); background:var(--sage-soft);}
.qcard.hidden{display:none;}
.qcard input[type=checkbox]{
  margin-top:4px; width:17px; height:17px; accent-color:var(--indigo); flex-shrink:0; cursor:pointer;

.qbody{flex:1; min-width:0;}
.qmeta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
.qnum{
  font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600;

.qtopic{
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase;

.qkind{

.qcard.selected .qkind{background:#0d0c11;}
.qtext{font-size:16px; color:var(--ink);}

#empty-state{

footer{text-align:center; color:var(--ink-soft); font-size:12.5px; padding:30px 20px 10px;}

@media print{

  .qtext, .qtopic, .qkind, .qnum{color:#111 !important; background:none !important;}
}

  const all = ['All', ...TOPICS];
  all.forEach(topic => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (topic === activeTopic ? ' active' : '');
    chip.dataset.topic = topic;
    chip.textContent = topic === 'All'
      ? `All (${QUESTIONS.length})`
      : `${topic} (${QUESTIONS.filter(q=>q.topic===topic).length})`;
    chip.addEventListener('click', () => {
      activeTopic = topic;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      applyFilters();
    });
    chipsEl.appendChild(chip);
  });
}

/* ---------------- Question cards ---------------- */
function buildList(){
  const frag = document.createDocumentFragment();
  QUESTIONS.forEach(q => {
    const card = document.createElement('div');
    card.className = 'qcard';
    card.id = 'q-' + q.id;
    card.dataset.topic = q.topic;
    card.dataset.search = (q.q + ' ' + q.topic + ' ' + q.kind).toLowerCase();

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.id = 'cb-' + q.id;
    cb.addEventListener('change', () => {
      if (cb.checked) selected.add(q.id); else selected.delete(q.id);
      card.classList.toggle('selected', cb.checked);
      updateCount();
    });
    card.appendChild(cb);

    const body = document.createElement('div');
    body.className = 'qbody';
    body.innerHTML = `
      <div class="qmeta">
        <span class="qnum">Q${q.id}</span>
        <span class="qtopic">${escapeHtml(q.topic)}</span>
        <span class="qkind">${escapeHtml(q.kind)}</span>
      </div>
      <div class="qtext">${escapeHtml(q.q)}</div>
    `;
    card.appendChild(body);

    card.addEventListener('click', (e) => {
      if (e.target.tagName === 'INPUT') return;
      cb.checked = !cb.checked;
      cb.dispatchEvent(new Event('change'));
    });

    frag.appendChild(card);
  });
  listEl.appendChild(frag);
}

/* ---------------- Filters ---------------- */
function applyFilters(){
  let visibleCount = 0;
  QUESTIONS.forEach(q => {
    const card = document.getElementById('q-' + q.id);
    const topicMatch = activeTopic === 'All' || q.topic === activeTopic;
    const searchMatch = !searchTerm || card.dataset.search.includes(searchTerm);
    const show = topicMatch && searchMatch;
    card.classList.toggle('hidden', !show);
    if (show) visibleCount++;
  });
  emptyState.style.display = visibleCount === 0 ? 'block' : 'none';
  updateCount();
}

function updateCount(){
  const visible = QUESTIONS.filter(q => !document.getElementById('q-'+q.id).classList.contains('hidden'));
  countLabel.textContent = `Showing ${visible.length} of ${QUESTIONS.length} \u00b7 ${selected.size} selected`;
}

document.getElementById('search').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim().toLowerCase();
  applyFilters();
});

document.getElementById('select-all-btn').addEventListener('click', () => {
  QUESTIONS.forEach(q => {
    const card = document.getElementById('q-' + q.id);
    if (!card.classList.contains('hidden')){
      const cb = document.getElementById('cb-' + q.id);
      cb.checked = true;
      selected.add(q.id);
      card.classList.add('selected');
    }
  });
  updateCount();
});

document.getElementById('clear-btn').addEventListener('click', () => {
  selected.clear();
  QUESTIONS.forEach(q => {
    document.getElementById('cb-' + q.id).checked = false;
    document.getElementById('q-' + q.id).classList.remove('selected');
  });
  updateCount();
  document.getElementById('copy-feedback').textContent = '';
});

/* ---------------- Copy helpers ---------------- */
function getSelectedQuestions(){
  return QUESTIONS.filter(q => selected.has(q.id));
}

document.getElementById('copy-text-btn').addEventListener('click', () => {
  const chosen = getSelectedQuestions();
  if (chosen.length === 0){ document.getElementById('copy-feedback').textContent = 'Select at least one question first.'; return; }
  const text = chosen.map((q,i) => `${i+1}. ${q.q}`).join('\n\n');
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById('copy-feedback').textContent = `Copied ${chosen.length} question(s) as plain text.`;
  }).catch(() => { document.getElementById('copy-feedback').textContent = 'Could not access clipboard.'; });
});

document.getElementById('copy-latex-btn').addEventListener('click', () => {
  const chosen = getSelectedQuestions();
  if (chosen.length === 0){ document.getElementById('copy-feedback').textContent = 'Select at least one question first.'; return; }
  const body = chosen.map(q => `  \\item ${q.q}`).join('\n');
  const text = `\\begin{enumerate}\n${body}\n\\end{enumerate}`;
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById('copy-feedback').textContent = `Copied ${chosen.length} question(s) as LaTeX.`;
  }).catch(() => { document.getElementById('copy-feedback').textContent = 'Could not access clipboard.'; });
});

/* ---------------- Boot ---------------- */
document.getElementById('page-footer').textContent =
  `${QUESTIONS.length} questions in the bank \u00b7 more will be added over time.`;

buildChips();
buildList();
applyFilters();

(function typesetWhenReady(attemptsLeft){
  if (window.MathJax && MathJax.typesetPromise){
    typeset();
  } else if (attemptsLeft > 0){
    setTimeout(() => typesetWhenReady(attemptsLeft - 1), 100);
  }
})(100);
</script>
</body>
