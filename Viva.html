<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Analysis &middot; Question Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
  }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js" id="MathJax-script" async></script>
<style>
:root{
  --indigo: #8f85e6;
  --indigo-deep: #d6d1ff;
  --indigo-soft: #756adf;
  --amber: #e8a53c;
  --sage: #86c091;
  --sage-soft: #16261a;
  --paper: #000000;
  --card: #131218;
  --ink: #f1f0f6;
  --ink-soft: #b6b3c8;
  --line: #2b2833;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(0,0,0,0.6), 0 8px 24px -12px rgba(143,133,230,0.28);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:
    radial-gradient(1200px 500px at 10% -10%, rgba(143,133,230,0.10) 0%, transparent 60%),
    radial-gradient(1000px 500px at 100% 0%, rgba(232,165,60,0.07) 0%, transparent 55%),
    var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans', system-ui, sans-serif;
  line-height:1.55;
  padding-bottom:60px;
}
.wrap{max-width:820px; margin:0 auto; padding:0 20px;}

header.top{padding:40px 0 22px; text-align:center;}
.eyebrow{
  font-family:'IBM Plex Mono', monospace; font-size:12.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--amber); font-weight:600; margin-bottom:10px;
}
h1{
  font-family:'Fraunces', serif; font-weight:600; font-size:clamp(28px,4.6vw,40px);
  margin:0 0 10px; color:var(--indigo-deep); letter-spacing:-0.01em;
}
.sub{color:var(--ink-soft); font-size:15px; max-width:540px; margin:0 auto;}

/* ---------- Toolbar ---------- */
#toolbar{
  position:sticky; top:0; z-index:50;
  background:rgba(247,246,251,0.94);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:14px 20px 12px;
  margin-bottom:26px;
}
.toolbar-inner{max-width:820px; margin:0 auto;}
#search{
  width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid var(--line);
  font-family:'IBM Plex Sans',sans-serif; font-size:15px; background:#0d0c11; color:var(--ink);
  margin-bottom:10px;
}
#search:focus{outline:none; border-color:var(--indigo-soft); box-shadow:0 0 0 3px rgba(108,98,184,0.15);}
.toolbar-bottom{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  flex-wrap:wrap;
}
#count-label{font-size:13px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
.actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.btn{
  appearance:none; border:none; cursor:pointer;
  font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:13.5px;
  padding:8px 14px; border-radius:99px;
  transition:transform .12s ease, background .12s ease;
}
.btn:hover{transform:translateY(-1px);}
.btn-primary{background:var(--indigo); color:#fff;}
.btn-primary:hover{background:var(--indigo-deep);}
.btn-primary:disabled{background:#312f3a; color:#726f80; cursor:not-allowed; transform:none;}
.btn-ghost{background:transparent; color:var(--indigo); border:1.5px solid var(--indigo-soft);}
.btn-ghost:hover{background:#1c1a28;}
.btn-sm{font-size:12.5px; padding:6px 11px;}
#copy-feedback{font-size:12.5px; color:var(--sage); font-family:'IBM Plex Mono',monospace; min-height:16px;}

/* ---------- Question list ---------- */
#list{margin-top:4px;}
.qcard{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px 20px; margin-bottom:12px;
  display:flex; gap:14px; align-items:flex-start;
  transition:border-color .12s ease;
}
.qcard.selected{border-color:var(--sage); background:var(--sage-soft);}
.qcard.hidden{display:none;}
.qcard input[type=checkbox]{
  margin-top:4px; width:17px; height:17px; accent-color:var(--indigo); flex-shrink:0; cursor:pointer;
}
.qbody{flex:1; min-width:0;}
.qmeta{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.qnum{
  font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600;
  color:#fff; background:var(--indigo-soft); padding:2px 8px; border-radius:99px;
}
.qtext{font-size:16px; color:var(--ink);}

#empty-state{
  text-align:center; padding:50px 20px; color:var(--ink-soft); display:none;
}

footer{text-align:center; color:var(--ink-soft); font-size:12.5px; padding:30px 20px 10px;}

@media print{
  #toolbar{display:none;}
  body{background:#fff !important; color:#111 !important; padding-bottom:0;}
  .qcard{box-shadow:none; break-inside:avoid; border:1px solid #ccc; background:#fff !important; color:#111 !important;}
  .qcard input[type=checkbox]{display:none;}
  .qtext, .qnum{color:#111 !important; background:none !important;}
}
</style>
</head>
<body>

<div id="toolbar">
  <div class="toolbar-inner">
    <input id="search" type="text" placeholder="Search questions&hellip;">
    <div class="toolbar-bottom">
      <div>
        <span id="count-label"></span>
        <span id="copy-feedback"></span>
      </div>
      <div class="actions">
        <button class="btn btn-ghost btn-sm" id="select-all-btn">Select all shown</button>
        <button class="btn btn-ghost btn-sm" id="clear-btn">Clear selection</button>
        <button class="btn btn-primary btn-sm" id="copy-text-btn">Copy selected &middot; plain text</button>
        <button class="btn btn-primary btn-sm" id="copy-latex-btn">Copy selected &middot; LaTeX</button>
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">Calculus-1</div>
    <h1>Question Bank</h1>
    <p class="sub">A single collection of questions. Search, select, and copy them into your tutorial sheets or assignments.</p>
  </header>

  <div id="list"></div>
  <div id="empty-state">No questions match your search.</div>

  <footer id="footer-count"></footer>
</div>

<script>
const RAW_QUESTIONS = [
  String.raw`Define rational numbers.`,
  String.raw`Show that $\sqrt{2}$ is an irrational number.`,
  String.raw`Show that $\sqrt{2} + r$, where $r \in \mathbb{Q}$, is an irrational number.`,
  String.raw`Show that $r\sqrt{2}$, where $r \in \mathbb{Q}$ and $r \ne 0$, is an irrational number.`,
  String.raw`Show that if $x$ is irrational, then $\dfrac{1}{x}$ is irrational.`,
  String.raw`If $a, b \in \mathbb{R}$ and $ab = 0$, then either $a = 0$ or $b = 0$.`,
  String.raw`If $a, b \in \mathbb{R}$ and $a^2 + b^2 = 0$, then $a = 0$ and $b = 0$.`,
  String.raw`If $a > b > 0$, then $\dfrac{1}{a} < \dfrac{1}{b}$.`,
  String.raw`If $a > b > 0$, then $a^n > b^n$ for all $n \in \mathbb{N}$.`,
  String.raw`Define an upper bound.`,
  String.raw`Let $A \ne \emptyset$. Then what do you mean by “$\alpha$ is not an upper bound of $A$”?`,
  String.raw`Define bounded above.`,
  String.raw`Show that $\mathbb{R}$ is not bounded above.`,
  String.raw`Show that $\mathbb{R}^+ = (0, \infty)$ is not bounded above.`,
  String.raw`Show that $1$ is the lub of $(0,1)$.`,
  String.raw`If $\emptyset \ne A \subseteq B$ and $B$ is bounded above, then $A$ is bounded above.`,
  String.raw`State the Least Upper Bound Property of $\mathbb{R}$.`,
  String.raw`State Archimedean Property.`,
  String.raw`If $x>0,$ then show that $\exists n\in \mathbb{N}$ such that $x>1/n.$`,
  String.raw`Prove that $\mathbb{Z}$ is not bounded below.`,
  String.raw`$\mathbb{Q}$ is dense in $\mathbb{R}$.`,
  String.raw`$\mathbb{R}\setminus\mathbb{Q}$ is dense in $\mathbb{R}$.`,
  String.raw`Define a function.`,
  String.raw`When do you say two functions $f$ and $g$ are equal?`,
  String.raw`Define one-one function. Provide an example of a 1-1 function and a function that is not 1-1.`,
  String.raw`Define onto function. Provide an example of an onto function and a function that is not onto.`,
  String.raw`Show that $f: \mathbb{R} \to \mathbb{R}$ defined as $f(x) = x^3$ is a bijective map.`,
  String.raw`Why is $e^x$ one-one but not onto?`,
  String.raw`Define composition of two maps.`,
  String.raw`Let $f: \mathbb{R} \to \mathbb{R}$ be a bijective map. Find its inverse $f^{-1}$. How are the graphs of $f$ and $f^{-1}$ related?`,
  String.raw`Define an increasing function. Give an example.`,
  String.raw`Define a decreasing function. Give an example.`,
  String.raw`What is a monotone function? When is a function called strictly monotone?`,
  String.raw`Can a function be both increasing and decreasing on the same interval? Justify your answer.`,
  String.raw`What do you mean by the local boundedness of a function at a point?`,
  String.raw`Does local boundedness at a point imply global boundedness on the domain? Explain.`,
  String.raw`What do you mean by the algebra of continuous functions?`,
  String.raw`State the rules for the sum, difference, product, and quotient of two continuous functions.`,
  String.raw`State the epsilon–delta definition of $\lim_{x \to a} f(x) = L$.`,
  String.raw`Explain the geometric meaning of the epsilon–delta definition of a limit with the help of a diagram.`,
  String.raw`In the epsilon–delta definition of a limit, does the value of $\delta$ depend on $\varepsilon$? Can it depend on the point $a$ as well?`,
  String.raw`Why is the condition $0 < |x - a|$ used instead of $|x - a| < \delta$ alone? What role does the point $a$ itself play?`,
  String.raw`Consider the function $f(x) = \begin{cases} 1, & \text{if } x \ge 0 \\ -1, & \text{if } x < 0 \end{cases}$. Using the epsilon–delta definition, explain why $\lim_{x \to 0} f(x)$ does not exist.`,
  String.raw`For the same function above, what is the maximum value of $\delta$ that works when proving continuity at $x = 3$?`,
  String.raw`For the same function above, is $f$ continuous at $x = 0$? Justify using the epsilon–delta definition.`,
  String.raw`For a constant function $f(x) = c$, why does a single $\delta$ work for every $\varepsilon > 0$?`,
  String.raw`What are the possible values of $\delta$ for the identity function $f(x) = x$ when proving continuity at an arbitrary point $a$?`,
  String.raw`If a smaller $\delta$ works for a given $\varepsilon$, will a larger $\delta$ also work? Explain.`,
  String.raw`State the epsilon–delta definition of continuity of a function $f$ at a point $a$.`,
  String.raw`What is the relationship between the limit of a function at a point and continuity at that point?`,
  String.raw`If $\lim_{x \to a} f(x) = L$ and $f(a) = M$ with $L \neq M$, what can you say about the continuity of $f$ at $a$?`,
  String.raw`If $\lim_{x \to a} f(x)$ does not exist but $f(a)$ is defined, is $f$ continuous at $a$? Give an example.`,
  String.raw`Can a function be continuous at a point but not locally bounded there? Explain.`,
  String.raw`If $f$ is continuous at $a$ and $f(a) > 0$, prove that there exists a neighbourhood of $a$ on which $f(x) > 0$.`,
  String.raw`If $f$ is continuous at $a$, is $|f|$ necessarily continuous at $a$? Is the converse true? Justify.`,
  String.raw`Prove that the sum of two continuous functions is continuous.`,
  String.raw`Prove that the product of two continuous functions is continuous.`,
  String.raw`If $f$ is continuous at $a$ and $g$ is continuous at $f(a)$, what can you say about the composite function $g \circ f$ at $a$?`,
  String.raw`Prove that the Dirichlet function $D(x) = \begin{cases} 1, & \text{if } x \in \mathbb{Q} \\ 0, & \text{if } x \notin \mathbb{Q} \end{cases}$ is discontinuous at every real number.`,
  String.raw`Prove that the greatest integer function $f(x) = \lfloor x \rfloor$ is discontinuous at every integer.`,
  String.raw`Is the greatest integer function continuous at non-integer points? Justify your answer.`,
  String.raw`Sketch the graph of the greatest integer function and identify all points of discontinuity.`,
  String.raw`Give an example of a function that is discontinuous at exactly one point.`,
  String.raw`Give an example of a function that is continuous everywhere except at the integers.`,
  String.raw`Classify the discontinuity of $f(x) = \dfrac{x^2 - 1}{x - 1}$ at $x = 1$.`,
  String.raw`Can a function be discontinuous at every rational point but continuous at every irrational point? Discuss.`,
  String.raw`Prove that if the domain of a function is a finite set, then the function is continuous at every point of its domain.`,
  String.raw`Prove that if the domain of a function is $\mathbb{N}$ (the set of natural numbers), then the function is continuous at every point.`,
  String.raw`Is every function defined on $\mathbb{Z}$ (the set of integers) continuous? Justify.`,
  String.raw`What is the key idea common to the two proofs above regarding the choice of $\delta$?`,
  String.raw`Why does the argument used for finite domains fail when the domain is $\mathbb{R}$?`,
  String.raw`Can a function defined on a finite domain ever be discontinuous? Explain.`,
  String.raw`Does continuity at a point imply differentiability at that point? Does differentiability imply continuity? Justify with examples.`,
  String.raw`Give an example of a function that is continuous everywhere but differentiable nowhere.`,
  String.raw`If $f$ and $g$ are discontinuous at $a$, can $f + g$ be continuous at $a$? Give an example.`,
  String.raw`If $f$ is continuous at $a$ and $g$ is discontinuous at $a$, what can you say about $f + g$ at $a$?`,
  String.raw`True or False: Every continuous function is bounded on its domain. Justify.`,
  String.raw`True or False: Every continuous function on a closed bounded interval attains its maximum and minimum. State the theorem.`,
  String.raw`State the Intermediate Value Theorem and give a geometric interpretation.`,
  String.raw`Use the Intermediate Value Theorem to show that the equation $x^3 - x - 1 = 0$ has a root in the interval $(1, 2)$.`
];

const QUESTIONS = RAW_QUESTIONS.map((q, idx) => ({ id: idx + 1, q }));

let searchTerm = '';
let selected = new Set();

const listEl = document.getElementById('list');
const emptyState = document.getElementById('empty-state');
const countLabel = document.getElementById('count-label');
const footerCount = document.getElementById('footer-count');

function buildList(){
  const frag = document.createDocumentFragment();
  QUESTIONS.forEach(q => {
    const card = document.createElement('div');
    card.className = 'qcard';
    card.id = 'q-' + q.id;
    card.dataset.search = q.q.toLowerCase();

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.id = 'cb-' + q.id;
    cb.addEventListener('change', () => {
      if (cb.checked) selected.add(q.id); else selected.delete(q.id);
      card.classList.toggle('selected', cb.checked);
      updateCount();
    });
    card.appendChild(cb);

    const body = document.createElement('div');
    body.className = 'qbody';
    
    const meta = document.createElement('div');
    meta.className = 'qmeta';
    
    const num = document.createElement('span');
    num.className = 'qnum';
    num.textContent = 'Q' + q.id;
    meta.appendChild(num);
    
    const text = document.createElement('div');
    text.className = 'qtext';
    text.textContent = q.q;

    body.appendChild(meta);
    body.appendChild(text);
    card.appendChild(body);

    card.addEventListener('click', (e) => {
      if (e.target.tagName !== 'INPUT') { 
        cb.checked = !cb.checked; 
        cb.dispatchEvent(new Event('change')); 
      }
    });

    frag.appendChild(card);
  });
  listEl.appendChild(frag);
  footerCount.textContent = `${QUESTIONS.length} questions in the bank so far.`;
}

function applyFilters(){
  let visibleCount = 0;
  QUESTIONS.forEach(q => {
    const card = document.getElementById('q-' + q.id);
    const searchMatch = !searchTerm || card.dataset.search.includes(searchTerm);
    card.classList.toggle('hidden', !searchMatch);
    if (searchMatch) visibleCount++;
  });
  emptyState.style.display = visibleCount === 0 ? 'block' : 'none';
  updateCount();
}

function updateCount(){
  const visible = QUESTIONS.filter(q => !document.getElementById('q-'+q.id).classList.contains('hidden'));
  countLabel.textContent = `Showing ${visible.length} of ${QUESTIONS.length} \u00b7 ${selected.size} selected`;
}

document.getElementById('search').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim().toLowerCase();
  applyFilters();
});

document.getElementById('select-all-btn').addEventListener('click', () => {
  QUESTIONS.forEach(q => {
    const card = document.getElementById('q-' + q.id);
    if (!card.classList.contains('hidden')){
      const cb = document.getElementById('cb-' + q.id);
      cb.checked = true;
      selected.add(q.id);
      card.classList.add('selected');
    }
  });
  updateCount();
});

document.getElementById('clear-btn').addEventListener('click', () => {
  selected.clear();
  QUESTIONS.forEach(q => {
    document.getElementById('cb-' + q.id).checked = false;
    document.getElementById('q-' + q.id).classList.remove('selected');
  });
  updateCount();
  document.getElementById('copy-feedback').textContent = '';
});

function getSelectedQuestions(){
  return QUESTIONS.filter(q => selected.has(q.id));
}

document.getElementById('copy-text-btn').addEventListener('click', () => {
  const chosen = getSelectedQuestions();
  if (chosen.length === 0){ document.getElementById('copy-feedback').textContent = 'Select at least one question first.'; return; }
  const text = chosen.map((q,i) => `${i+1}. ${q.q}`).join('\n\n');
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById('copy-feedback').textContent = `Copied ${chosen.length} question(s) as plain text.`;
  }).catch(() => { document.getElementById('copy-feedback').textContent = 'Could not access clipboard.'; });
});

document.getElementById('copy-latex-btn').addEventListener('click', () => {
  const chosen = getSelectedQuestions();
  if (chosen.length === 0){ document.getElementById('copy-feedback').textContent = 'Select at least one question first.'; return; }
  const body = chosen.map(q => `  \\item ${q.q}`).join('\n');
  const text = `\\begin{enumerate}\n${body}\n\\end{enumerate}`;
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById('copy-feedback').textContent = `Copied ${chosen.length} question(s) as LaTeX.`;
  }).catch(() => { document.getElementById('copy-feedback').textContent = 'Could not access clipboard.'; });
});

buildList();
applyFilters();

function triggerTypeset() {
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise().catch(err => console.error('MathJax error:', err));
  } else {
    setTimeout(triggerTypeset, 100);
  }
}
triggerTypeset();
</script>
</body>
</html>
