<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Functions Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { background: #050505; color: #e5e5e5; font-family: 'Inter', sans-serif; }
    .card {
      border: 1px solid #262626;
      background: rgba(23, 23, 23, 0.5);
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 300ms, transform 300ms;
    }
    .card:hover {
      border-color: #404040;
      transform: translateY(-2px);
    }
    .iframe-wrapper {
      position: relative;
      width: 100%;
      height: 260px;
      background: #080808;
      overflow: hidden;
    }
    .iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      pointer-events: none; /* Allows click-through to open detail view */
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      border: 1px solid #262626;
      font-size: 12px;
      color: #a3a3a3;
      background: rgba(23, 23, 23, 0.5);
    }
  </style>
</head>
<body class="antialiased">

  <!-- Header -->
  <header class="border-b border-neutral-800 bg-neutral-950/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-screen-2xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="index.html" class="text-neutral-400 hover:text-white transition-colors flex items-center gap-2 text-sm">
          <span class="iconify" data-icon="lucide:arrow-left"></span> Home
        </a>
        <h1 class="font-heading text-lg font-medium text-white">Functions Gallery</h1>
      </div>
      <span class="badge">
        <span class="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
        <span id="countBadge">60 Functions</span>
      </span>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-screen-2xl mx-auto px-6 py-12">
    <div id="functionGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <!-- Generated dynamically by JS -->
    </div>
  </main>

  <script>
    // Configuration: Update TOTAL_FILES when you add more files
    const TOTAL_FILES = 60;
    const FOLDER_PATH = 'functions';

    function buildGrid() {
      const grid = document.getElementById('functionGrid');
      let html = '';

      for (let i = 1; i <= TOTAL_FILES; i++) {
        const filePath = `${FOLDER_PATH}/${i}.html`;
        const paddedNum = String(i).padStart(2, '0');

        html += `
          <div class="card flex flex-col justify-between">
            <div>
              <div class="iframe-wrapper">
                <iframe src="${filePath}" loading="lazy" title="Function ${i}"></iframe>
              </div>
              <div class="p-4">
                <p class="text-xs text-neutral-500 font-mono uppercase tracking-wider mb-1">Item ${paddedNum}</p>
                <h3 class="font-heading text-base font-medium text-white">Function ${i}</h3>
              </div>
            </div>
            <div class="px-4 pb-4">
              <a href="${filePath}" target="_blank" class="w-full inline-flex items-center justify-center gap-2 px-4 py-2 bg-neutral-800 hover:bg-neutral-700 text-neutral-200 text-xs font-medium rounded transition-colors">
                Open Full View
                <span class="iconify" data-icon="lucide:external-link"></span>
              </a>
            </div>
          </div>
        `;
      }

      grid.innerHTML = html;
      document.getElementById('countBadge').textContent = `${TOTAL_FILES} Items Loaded`;
    }

    buildGrid();
  </script>
</body>
</html>
